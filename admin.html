<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | AG.dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #020617; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 1.5rem; }
    </style>
</head>
<body class="text-slate-200 font-sans">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold"><i class="fas fa-user-shield text-indigo-400 mr-2"></i> Панель управления</h1>
            <div class="flex gap-4">
                <span class="glass-card px-4 py-2 rounded-full text-sm"><i class="fas fa-user mr-2"></i> <span id="adminName">Антон</span></span>
                <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 px-4 py-2 rounded-full text-sm transition"><i class="fas fa-sign-out-alt mr-1"></i> Выйти</button>
            </div>
        </div>

        <!-- Статистика -->
        <div class="grid md:grid-cols-4 gap-4 mb-8" id="statsCards">
            <div class="glass-card p-5 text-center"><div class="text-3xl font-bold text-indigo-400" id="totalClients">0</div><div class="text-sm">Клиентов</div></div>
            <div class="glass-card p-5 text-center"><div class="text-3xl font-bold text-emerald-400" id="totalTasks">0</div><div class="text-sm">Задач</div></div>
            <div class="glass-card p-5 text-center"><div class="text-3xl font-bold text-yellow-400" id="pendingTasks">0</div><div class="text-sm">На оценке</div></div>
            <div class="glass-card p-5 text-center"><div class="text-3xl font-bold text-blue-400" id="activeTasks">0</div><div class="text-sm">В работе</div></div>
        </div>

        <!-- Клиенты -->
        <div class="glass-card p-6 mb-8">
            <h2 class="text-xl font-bold mb-4"><i class="fas fa-users mr-2 text-indigo-400"></i> Клиенты</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="border-b border-slate-700"><tr><th class="text-left py-2">Клиент</th><th class="text-left">Пакет часов</th><th class="text-left">Использовано</th><th class="text-left">Осталось</th><th class="text-left">Действия</th></tr></thead>
                    <tbody id="clientsTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Задачи со статусами -->
        <div class="glass-card p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold"><i class="fas fa-tasks mr-2 text-indigo-400"></i> Все задачи</h2>
                <div class="flex gap-2">
                    <select id="filterClient" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm"><option value="">Все клиенты</option></select>
                    <select id="filterStatus" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm"><option value="">Все статусы</option><option value="pending_estimate">На оценке</option><option value="waiting_approval">Ждёт согласования</option><option value="in_progress">В работе</option><option value="completed">Завершено</option></select>
                </div>
            </div>
            <div id="tasksList" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allClients = [];
        let allTasks = [];
        let allProjects = [];

        async function api(url, options = {}) {
            const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
            return res.json();
        }

        async function loadData() {
            allClients = await api('/api/users');
            allTasks = await api('/api/tasks');
            allProjects = await api('/api/projects');
            
            document.getElementById('totalClients').innerText = allClients.length;
            document.getElementById('totalTasks').innerText = allTasks.length;
            document.getElementById('pendingTasks').innerText = allTasks.filter(t => t.status === 'pending_estimate').length;
            document.getElementById('activeTasks').innerText = allTasks.filter(t => t.status === 'in_progress').length;
            
            renderClientsTable();
            renderFilters();
            renderTasks();
        }

        function renderClientsTable() {
            const tbody = document.getElementById('clientsTable');
            tbody.innerHTML = allClients.map(client => {
                const hoursLeft = (client.hours_package || 0) - (client.hours_used || 0);
                return `<tr class="border-b border-slate-800"><td class="py-2">${client.name}</td><td>${client.hours_package || 0} ч</td><td>${client.hours_used || 0} ч</td><td class="${hoursLeft < 0 ? 'text-red-400' : 'text-emerald-400'}">${hoursLeft} ч</td><td><button onclick="openClientDetail('${client.id}')" class="text-indigo-400 text-xs">Детали</button></td></tr>`;
            }).join('');
        }

        function renderFilters() {
            const clientSelect = document.getElementById('filterClient');
            clientSelect.innerHTML = '<option value="">Все клиенты</option>' + allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        function renderTasks() {
            const clientFilter = document.getElementById('filterClient').value;
            const statusFilter = document.getElementById('filterStatus').value;
            let filtered = allTasks;
            if (clientFilter) filtered = filtered.filter(t => t.clientId === clientFilter);
            if (statusFilter) filtered = filtered.filter(t => t.status === statusFilter);
            
            const container = document.getElementById('tasksList');
            if (filtered.length === 0) { container.innerHTML = '<div class="text-center text-slate-500 py-8">Нет задач</div>'; return; }
            
            container.innerHTML = filtered.map(task => {
                const project = allProjects.find(p => p.id === task.projectId);
                const client = allClients.find(c => c.id === task.clientId);
                const statusMap = { pending_estimate: '⏳ На оценке', waiting_approval: '📋 Ждёт согласования', in_progress: '⚙️ В работе', completed: '✅ Завершено' };
                return `<div class="glass-card p-4"><div class="flex justify-between items-start"><div><h3 class="font-bold">${task.title}</h3><p class="text-sm text-slate-400">${client?.name || ''} / ${project?.name || ''}</p><p class="text-xs text-slate-500 mt-1">${task.description}</p></div><div><span class="px-2 py-1 rounded-full text-xs ${task.status === 'pending_estimate' ? 'bg-yellow-600/30' : task.status === 'waiting_approval' ? 'bg-blue-600/30' : task.status === 'in_progress' ? 'bg-emerald-600/30' : 'bg-slate-600/30'}">${statusMap[task.status]}</span></div></div><div class="flex flex-wrap gap-3 mt-3 text-sm"><span><i class="fas fa-hourglass-half text-indigo-400"></i> Оценка: ${task.estimated_hours || '—'} ч</span><span><i class="fas fa-check-circle text-emerald-400"></i> Согласовано: ${task.approved_hours || '—'} ч</span><span><i class="fas fa-clock text-slate-400"></i> Потрачено: ${task.spent_hours || 0} ч</span></div><div class="flex gap-2 mt-3">${renderTaskActions(task)}</div></div>`;
            }).join('');
        }

        function renderTaskActions(task) {
            if (task.status === 'pending_estimate') {
                return `<input type="number" id="hours_${task.id}" placeholder="Часы" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 w-24 text-sm"><button onclick="estimateTask('${task.id}')" class="bg-indigo-600 px-3 py-1 rounded-lg text-sm">Оценить →</button>`;
            }
            if (task.status === 'waiting_approval') {
                return `<span class="text-yellow-400 text-sm">Ожидает согласования клиентом</span>`;
            }
            if (task.status === 'in_progress') {
                return `<input type="number" id="spend_${task.id}" placeholder="Часы" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 w-24 text-sm"><button onclick="spendHours('${task.id}')" class="bg-emerald-600 px-3 py-1 rounded-lg text-sm">Списать часы</button>`;
            }
            return '';
        }

        window.estimateTask = async (taskId) => {
            const hours = document.getElementById(`hours_${taskId}`).value;
            if (!hours) { alert('Введите количество часов'); return; }
            await api(`/api/tasks/${taskId}`, { method: 'PUT', body: JSON.stringify({ estimated_hours: parseInt(hours), status: 'waiting_approval' }) });
            loadData();
        };

        window.spendHours = async (taskId) => {
            const hours = document.getElementById(`spend_${taskId}`).value;
            if (!hours) { alert('Введите количество часов'); return; }
            await api(`/api/tasks/${taskId}/spend`, { method: 'POST', body: JSON.stringify({ hours: parseFloat(hours) }) });
            loadData();
        };

        window.openClientDetail = (clientId) => {
            alert(`Функция детального просмотра клиента ${clientId} — можно расширить`);
        };

        window.logout = () => { localStorage.removeItem('user'); window.location.href = 'index.html'; };

        (async () => {
            const saved = localStorage.getItem('user');
            if (!saved) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(saved);
            document.getElementById('adminName').innerText = currentUser.name;
            await loadData();
            setInterval(loadData, 30000);
        })();
    </script>
</body>
</html>
